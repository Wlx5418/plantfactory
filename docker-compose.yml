version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: plantfactory-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: plant_factory
      MYSQL_USER: plant_factory
      MYSQL_PASSWORD: plant_factory_2024
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./docker/mysql/conf:/etc/mysql/conf.d
    networks:
      - plantfactory-network
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone='+08:00'
      --innodb-buffer-pool-size=256M
      --max_connections=200

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: plantfactory-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf
    networks:
      - plantfactory-network
    command: redis-server /etc/redis/redis.conf

  # Spring Boot后端
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantfactory-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: plant_factory
      DB_USERNAME: plant_factory
      DB_PASSWORD: plant_factory_2024

      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      # JWT配置
      JWT_SECRET: plant-factory-jwt-secret-key-2024-prod

      # JVM参数
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - plantfactory-network
    depends_on:
      - mysql
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: plantfactory-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./dist:/usr/share/nginx/html
      - ./ssl:/etc/nginx/ssl
    networks:
      - plantfactory-network
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  plantfactory-network:
    driver: bridge