# 开发环境配置
spring:
  # 使用H2内存数据库进行快速测试
  datasource:
    url: jdbc:h2:mem:plantfactorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # H2数据库控制台配置
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: true

  # H2数据库初始化
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
      data-locations: classpath:db/h2/data.sql

# 日志配置
logging:
  level:
    com.qzsf: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG

# JWT配置（开发环境使用较短过期时间）
jwt:
  secret: plant-factory-jwt-secret-key-for-hs512-algorithm-2024-512bits-minimum
  expiration: 3600000  # 1小时 (毫秒)
  refresh-expiration: 86400000  # 1天 (毫秒)