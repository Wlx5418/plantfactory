# 开发环境配置
spring:
  # 使用MySQL数据库
  datasource:
    url: jdbc:mysql://localhost:3306/plant_factory?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update  # 自动更新表结构
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true

# 日志配置
logging:
  level:
    com.qzsf: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG

# JWT配置（开发环境使用较短过期时间）
jwt:
  secret: plant-factory-jwt-secret-key-for-hs512-algorithm-2024-512bits-minimum
  expiration: 3600000  # 1小时 (毫秒)
  refresh-expiration: 86400000  # 1天 (毫秒)